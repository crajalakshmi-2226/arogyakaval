  let tr="";
  if(pts.length>1){const c=pts[pts.length-1][key],p=pts[pts.length-2][key],w=c>p?x("அதிகம்","higher than"):c<p?x("குறைவு","lower than"):x("சமம்","the same as");
    tr=`<p>${x(`சமீபத்திய ${vl(m)} (${c}) முந்தைய பதிவை (${p}) விட ${w}.`,`Your latest ${vl(m)} (${c}) is ${w} your previous entry (${p}).`)} <span class="muted">${x("இது போக்கு மட்டுமே, நோய் கண்டறிதல் அல்ல.","This is a trend only, not a diagnosis.")}</span></p>`}
  $("vo").innerHTML=svg+(m==="bp"?`<div class="muted">● ${x("மேல்","upper")} ● ${x("கீழ்","lower")}</div>`:"")+tr+pts.slice().reverse().map(e=>`<div class="muted" style="padding:3px 0;border-bottom:1px solid var(--line)">${new Date(e.ts).toLocaleString(loc)} — <b>${m==="bp"?e.s+"/"+e.d:e[m]} ${VM[m][2]}</b></div>`).join("");
}

/* ---------- Medicine ---------- */
const fd=v=>({b:x("உணவுக்கு முன்","Before food"),a:x("உணவுக்கு பின்","After food"),w:x("உணவுடன்","With food")}[v]||"");
const medAct=(m,d)=>m.start<=d&&(!m.end||m.end>=d);
const hmNow=()=>{const n=new Date();return String(n.getHours()).padStart(2,"0")+":"+String(n.getMinutes()).padStart(2,"0")};
function rMed(){
  U.meds=U.meds||[];U.mlog=U.mlog||{};
  const t=td(),hm=hmNow(),stt=(m,tm,d)=>(U.mlog[d]||{})[m.id+"_"+tm],rows=[];
  U.meds.filter(m=>medAct(m,t)).forEach(m=>m.times.forEach(tm=>rows.push({m,tm})));rows.sort((a,b)=>a.tm<b.tm?-1:a.tm>b.tm?1:0);
  let tk=0,sk=0,pd=0;
  const list=rows.map(({m,tm})=>{const s=stt(m,tm,t);if(s==="taken")tk++;else if(s==="skipped")sk++;else pd++;
    const note=[m.doc,m.notes].filter(Boolean).map(esc).join(" · ");
    return `<div class="card" style="margin:8px 0"><b>💊 ${esc(m.n)}</b> · ${tm}${m.food?" · "+fd(m.food):""}${note?`<div class="muted">${note}</div>`:""}${s?`<span class="chip">${s==="taken"?"✅ "+x("எடுத்தேன்","Taken"):"⏭️ "+x("தவிர்த்தேன்","Skipped")}</span>`:tm<hm?`<span class="chip">⚠️ ${x("தவறியிருக்கலாம்","Possibly missed")}</span>`:""}<br><button class="p" onclick="ms('${m.id}','${tm}','taken')">${x("எடுத்தேன்","Taken")}</button> <button class="g" onclick="ms('${m.id}','${tm}','skipped')">${x("தவிர்த்தேன்","Skipped")}</button></div>`}).join("");
  let hh="";
  for(let i=0;i<7;i++){const d=ago(i);let a=0,b=0,c=0;
    U.meds.filter(m=>medAct(m,d)).forEach(m=>m.times.forEach(tm=>{const s=stt(m,tm,d);if(s==="taken")a++;else if(s==="skipped")b++;else if(d<t||tm<hm)c++}));
    if(a+b+c)hh+=`<div style="padding:4px 0;border-bottom:1px solid var(--line)"><b>${d}</b> · ✅ ${a} · ⏭️ ${b} · ⚠️ ${c}</div>`}
  const mine=U.meds.map(m=>`<div style="padding:6px 0;border-bottom:1px solid var(--line)">💊 <b>${esc(m.n)}</b> · ${m.times.join(", ")} (${m.times.length}×/${x("நாள்","day")}) · ${m.start} → ${m.end||"…"} <button class="g" onclick="md('${m.id}')" aria-label="Delete">🗑</button></div>`).join("");
  $("med").innerHTML=`<h2>${x("மருந்து நினைவூட்டல்","Medicine reminders")}</h2>
  <div class="lvl warn"><b>${x("முக்கியம்","Important")}</b>${x("மருத்துவர் எழுதிக்கொடுத்ததை அப்படியே உள்ளிடவும். இந்த app மருந்து அளவை மாற்றவோ பரிந்துரைக்கவோ செய்யாது.","Enter exactly what your doctor prescribed. This app does not change or suggest doses.")}</div>
  <div class="card"><h3>${x("இன்றைய சுருக்கம்","Today's summary")}</h3>✅ ${x("எடுத்தது","Taken")}: ${tk} · ⏭️ ${x("தவிர்த்தது","Skipped")}: ${sk} · ⏳ ${x("மீதம்","Pending")}: ${pd}${list||`<p class="muted">${x("இன்று மருந்து இல்லை.","No medicines scheduled today.")}</p>`}</div>
  <div class="card"><h3>${x("மருந்து சேர்","Add medicine")}</h3>${fl("m_n",x("மருந்து பெயர்","Medicine name"))}
  <label>${x("நேரம் (அதிகபட்சம் 3 முறை)","Times (up to 3 a day)")}</label><div class="row"><input id="m_t1" type="time" aria-label="Time 1"><input id="m_t2" type="time" aria-label="Time 2"><input id="m_t3" type="time" aria-label="Time 3"></div>
  <label for="m_f">${x("உணவு","Food instruction")}</label><select id="m_f"><option value="b">${x("உணவுக்கு முன்","Before food")}</option><option value="a" selected>${x("உணவுக்கு பின்","After food")}</option><option value="w">${x("உணவுடன்","With food")}</option><option value="">${x("குறிப்பு இல்லை","Not specified")}</option></select>
  <div class="row"><div>${fl("m_s",x("தொடக்க தேதி","Start date"),"date")}</div><div>${fl("m_e",x("முடிவு தேதி","End date"),"date")}</div></div>${fl("m_d",x("மருத்துவர் / மருத்துவமனை","Doctor / hospital"))}${fl("m_o",x("குறிப்பு (விருப்பம்)","Notes (optional)"))}
  <button class="p" id="ma" type="button">${x("சேமி","Save")}</button></div>
  ${mine?`<div class="card"><h3>${x("என் மருந்துகள்","My medicines")}</h3>${mine}</div>`:""}
  <div class="card"><h3>${x("கடந்த 7 நாள் வரலாறு","Last 7 days history")}</h3>${hh||`<p class="muted">${x("பதிவு இல்லை.","No history yet.")}</p>`}<p class="muted">✅ ${x("எடுத்தது","Taken")} · ⏭️ ${x("தவிர்த்தது","Skipped")} · ⚠️ ${x("தவறியது","Missed")}. ${x("நினைவூட்டல் இந்த பக்கம் உலாவியில் திறந்திருக்கும்போது மட்டுமே வரும்.","Reminders only work while this page is open in your browser.")}</p></div>`;
  $("m_s").value=t;
  $("ma").onclick=()=>{const g=id=>$(id).value.trim(),times=["m_t1","m_t2","m_t3"].map(g).filter(Boolean);
    if(!g("m_n")||!times.length){alert(x("மருந்து பெயர், குறைந்தது ஒரு நேரம் தேவை.","Medicine name and at least one time are required."));return}
    U.meds.push({id:Date.now().toString(36),n:g("m_n"),times:[...new Set(times)].sort(),food:$("m_f").value,start:g("m_s")||t,end:g("m_e"),doc:g("m_d"),notes:g("m_o")});save();
    if("Notification" in window&&Notification.permission==="default")Notification.requestPermission();rMed()};
}
function ms(id,tm,s){const t=td();U.mlog=U.mlog||{};(U.mlog[t]=U.mlog[t]||{})[id+"_"+tm]=s;save();rMed()}
function md(id){if(confirm(x("இந்த மருந்தை நீக்கவா?","Delete this medicine?"))){U.meds=U.meds.filter(m=>m.id!==id);save();rMed()}}
let lastN="";
setInterval(()=>{if(!U||!U.meds)return;const t=td(),hm=hmNow();if(lastN===t+hm)return;lastN=t+hm;
  U.meds.filter(m=>medAct(m,t)&&m.times.includes(hm)).forEach(m=>{if((U.mlog[t]||{})[m.id+"_"+hm])return;
    const msg=x("மருந்து நேரம்: ","Medicine time: ")+m.n+(m.food?" ("+fd(m.food)+")":"");
    if("Notification" in window&&Notification.permission==="granted")new Notification("ArogyaKaval",{body:msg});else alert(msg)})},15000);


/* ---------- Profile ---------- */
function rProf(){
  const p=U.p,r=(l,v,tel)=>v?`<div><span class="muted">${l}</span><br>${tel?`<a href="tel:${esc(v)}">${esc(v)}</a>`:esc(v)}</div>`:"";
  const cond=[p.cs&&x("சர்க்கரை","Diabetes"),p.cb&&"BP",p.co&&(p.cot||x("வேறு","Other"))].filter(Boolean).join(", ");
  $("prof").innerHTML=`<h2>${x("என் தகவல்","My info")}</h2><div class="card"><div class="row">${r(x("பெயர்","Name"),p.n)}${r(x("வயது","Age"),p.ag)}${r(x("தொலைபேசி","Phone"),p.ph,1)}${r("Email",p.em)}${r(x("மாவட்டம்","District"),(P[p.dist]||P[0])[0])}${r(x("ஊர்","Town"),p.loc)}${r(x("நிலை","Condition"),cond)}</div></div>
  <div class="card"><h3>${x("குடும்பம் / பாதுகாவலர்","Family / Guardian")}</h3><div class="row">${r(p.f1n||x("நபர் 1","Person 1"),p.f1p,1)}${r(p.f2n||x("நபர் 2","Person 2"),p.f2p,1)}${r((p.gn||x("பாதுகாவலர்","Guardian"))+" (Guardian)",p.gp,1)}</div></div>
  <div class="card"><h3>${x("அருகிலுள்ள மருத்துவமனை","Nearby hospitals")}</h3><div class="row">${[1,2].map(n=>r(p["h"+n+"n"]?p["h"+n+"n"]+" ("+ht(p["h"+n+"t"])+")":"",p["h"+n+"p"],1)).join("")}</div></div>
  <button class="p" id="ed">${x("தகவலை மாற்று","Edit info")}</button> <button class="g" id="so">${x("வெளியேறு","Sign out")}</button>
  <p class="muted">⚠️ ${x("இந்த app மருத்துவரின் ஆலோசனைக்கு மாற்று அல்ல. தகவல் உங்கள் போனில் மட்டுமே உள்ளது.","This app is not a substitute for a doctor. Your data stays on your phone only.")}</p>`;
  $("ed").onclick=()=>showReg(Object.assign({},U.p));$("so").onclick=()=>{try{localStorage.removeItem("ak_cur")}catch(e){}U=null;showReg()};
}

/* ---------- Start ---------- */
head();
const curE=gl("ak_cur");U=curE?gl("ak_u_"+curE):null;
U?enter():showReg();
</script>

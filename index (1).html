    $("isr").innerHTML=k==="none"?lvl("ok",x("நல்லது!","Great!"),x("இன்று உடல்நலம் நன்றாக இருப்பதில் மகிழ்ச்சி.","Glad you are doing well today.")):gH(k==="other"?"":k,esc(o));
  };
}
function fu(i,ok){const e=U.log[i];if(ok){e.rec=true;save();rChk()}else $("fu"+i).innerHTML=gH(e.k==="other"?"":e.k,esc(e.o))+lvl("warn",x("இன்று இவற்றை செய்யுங்கள்","Do these today"),x("நிறைய தண்ணீர் குடியுங்கள், நேரத்துக்கு எளிய உணவு, ஓய்வு, மருத்துவர் சொன்ன மாத்திரை. 2–3 நாளில் சரியாகாவிட்டால் மருத்துவரை அணுகுங்கள்.","Drink plenty of water, eat light food on time, rest, and take your prescribed tablets. If it is not better in 2-3 days, see a doctor."))}
function wt(n){const d=dayO();d.w=Math.max(0,d.w+n);save();rChk()}
function an(k,v){dayO()[k]=v;save();rChk()}

/* ---------- History ---------- */
function rHist(){
  let h="",cnt={},days=0;
  const mk=v=>v==null?"–":v?"✔":"✘";
  for(let i=0;i<7;i++){
    const d=ago(i),es=U.log.filter(e=>e.d===d),dd=U.day[d],pr=es.filter(e=>e.k!=="none");
    if(pr.length)days++;pr.forEach(e=>{const n=nm(e);cnt[n]=(cnt[n]||0)+1});
    h+=`<div class="card"><b>${d}</b>${i===0?x(" (இன்று)"," (today)"):""}<br>`+(es.length?es.map(e=>`<span class="chip">${esc(nm(e))}${e.k!=="none"?(e.rec?" ✅":" ⏳"):""}</span>`).join(""):`<span class="muted">${x("பதிவு இல்லை","No entry")}</span>`)+(dd?`<div class="muted">💧 ${dd.w} ${x("டம்ளர்","glasses")} · ${x("சாப்பாடு","Food")} ${mk(dd.m)} · ${x("ஓய்வு","Rest")} ${mk(dd.r)} · ${x("மாத்திரை","Tablet")} ${mk(dd.t)}</div>`:"")+"</div>";
  }
  const top=Object.entries(cnt).sort((a,b)=>b[1]-a[1])[0];
  const sm=days?x(`கடந்த 7 நாளில் <b>${days}</b> நாள் பிரச்சனை பதிவாகியுள்ளது.${top?` அதிகம்: <b>${esc(top[0])}</b> (${top[1]} முறை).`:""}${top&&top[1]>=3?`<br><b>ஒரே பிரச்சனை பலமுறை வந்துள்ளது — மருத்துவரை பார்ப்பது நல்லது.</b>`:""}`,`You logged a problem on <b>${days}</b> of the last 7 days.${top?` Most frequent: <b>${esc(top[0])}</b> (${top[1]} times).`:""}${top&&top[1]>=3?`<br><b>The same problem has come up several times, so it is a good idea to see a doctor.</b>`:""}`):x("இந்த வாரம் பிரச்சனை பதிவு இல்லை. 👍","No problems logged this week. 👍");
  $("hist").innerHTML=`<h2>${x("கடந்த 7 நாள்","Last 7 days")}</h2><div class="card">${sm}</div>`+h;
}

/* ---------- Guide ---------- */
function rGuide(k){
  $("guide").innerHTML=`<h2>${x("நோய் வழிகாட்டி","Health guide")}</h2><div>${Object.keys(G).map(q=>`<button class="g ${q===k?"sel":""}" onclick="rGuide('${q}')">${gn(q)}</button>`).join("")}</div><div style="margin-top:10px">${k?gH(k):`<p class="muted">${x("மேலே ஒரு பிரச்சனையை தேர்வு செய்யவும்.","Choose a problem above.")}</p>`}</div>`;
}

/* ---------- Sugar / BP ---------- */
function rHlth(){
  $("hlth").innerHTML=`<h2>${x("சர்க்கரை & BP சோதனை","Sugar & BP check")}</h2><div class="card"><p class="muted">${x("IDRS (Madras Diabetes Research Foundation) அடிப்படையில். பரிசோதனை அல்ல, ஆபத்து மதிப்பீடு மட்டும்.","Based on the IDRS (Madras Diabetes Research Foundation). A risk estimate only, not a diagnosis.")}</p>
  <div class="row"><div>${fl("ag2",x("வயது","Age"),"number")}</div><div><label for="sex">${x("பாலினம்","Sex")}</label><select id="sex"><option value="m">${x("ஆண்","Male")}</option><option value="f">${x("பெண்","Female")}</option></select></div></div>
  ${fl("wa",x("இடுப்பளவு (cm)","Waist (cm)"),"number")}<label for="ac">${x("உடல் உழைப்பு","Physical activity")}</label><select id="ac"><option value="0">${x("கடின உழைப்பு/உடற்பயிற்சி","Vigorous work/exercise")}</option><option value="10">${x("மிதமான","Moderate")}</option><option value="20">${x("லேசான","Mild")}</option><option value="30">${x("உட்கார்ந்தே","Sedentary")}</option></select>
  <label for="fa">${x("குடும்பத்தில் சர்க்கரை","Family history of diabetes")}</label><select id="fa"><option value="0">${x("இல்லை","None")}</option><option value="10">${x("ஒருவருக்கு","One parent")}</option><option value="20">${x("இருவருக்கும்","Both parents")}</option></select>
  <button class="p" id="db">${x("மதிப்பிடு","Check risk")}</button><div id="do"></div></div>
  <div class="card"><h3>${x("இரத்த அழுத்தம்","Blood pressure")}</h3><div class="row"><div>${fl("sy",x("மேல் (Systolic)","Upper (Systolic)"),"number")}</div><div>${fl("di",x("கீழ் (Diastolic)","Lower (Diastolic)"),"number")}</div></div><button class="p" id="bb">${x("பார்","Check")}</button><div id="bo"></div></div>`;
  $("ag2").value=U.p.ag;
  $("db").onclick=()=>{const a=+$("ag2").value,w=+$("wa").value,m=$("sex").value==="m";if(!a||!w){$("do").innerHTML=lvl("warn",x("விவரம் தேவை","Details needed"),x("வயது, இடுப்பளவு உள்ளிடவும்.","Enter age and waist size."));return}
    let s=a>=50?30:a>=35?20:0;s+=m?(w>=100?20:w>=90?10:0):(w>=90?20:w>=80?10:0);s+=+$("ac").value+ +$("fa").value;
    $("do").innerHTML=(s>=60?lvl("bad",x("அதிக ஆபத்து — ","High risk — ")+s+"/100",x("மருத்துவரை பார்த்து இரத்த சர்க்கரை (FBS/HbA1c) பரிசோதியுங்கள்.","See a doctor and get a blood sugar test (FBS/HbA1c).")):s>=30?lvl("warn",x("நடுத்தர ஆபத்து — ","Moderate risk — ")+s+"/100",x("6 மாதத்துக்கு ஒருமுறை பரிசோதனை, தினம் 30 நிமிட நடை.","Test every 6 months and walk 30 minutes daily.")):lvl("ok",x("குறைந்த ஆபத்து — ","Low risk — ")+s+"/100",x("இதே பழக்கத்தை தொடருங்கள்.","Keep up your current habits.")))+gH("sugar")};
  $("bb").onclick=()=>{const s=+$("sy").value,d=+$("di").value;if(!s||!d)return;
    $("bo").innerHTML=s>=180||d>=120?lvl("bad",x("அவசரம்","Emergency"),x("உடனே மருத்துவமனை செல்லுங்கள் அல்லது 108.","Go to a hospital immediately or call 108.")):s>=140||d>=90?lvl("bad",x("உயர் இரத்த அழுத்தம்","High blood pressure"),x("மருத்துவரை சந்தியுங்கள்; உப்பு குறையுங்கள்.","See a doctor and reduce salt."))+gH("bp"):s>=130||d>=80?lvl("warn",x("சற்று அதிகம்","Slightly high"),x("உப்பு குறைத்து, நடை பழகி, 1 மாதம் கண்காணியுங்கள்.","Cut down salt, walk daily and monitor for a month.")):lvl("ok",x("சாதாரணம்","Normal"),x("நல்ல நிலை.","Looks good."))};
}

/* ---------- Profile ---------- */
function rProf(){
  const p=U.p,r=(l,v,tel)=>v?`<div><span class="muted">${l}</span><br>${tel?`<a href="tel:${esc(v)}">${esc(v)}</a>`:esc(v)}</div>`:"";
  const cond=[p.cs&&x("சர்க்கரை","Diabetes"),p.cb&&"BP",p.co&&(p.cot||x("வேறு","Other"))].filter(Boolean).join(", ");
  $("prof").innerHTML=`<h2>${x("என் தகவல்","My info")}</h2><div class="card"><div class="row">${r(x("பெயர்","Name"),p.n)}${r(x("வயது","Age"),p.ag)}${r(x("தொலைபேசி","Phone"),p.ph,1)}${r("Email",p.em)}${r(x("மாவட்டம்","District"),(P[p.dist]||P[0])[0])}${r(x("ஊர்","Town"),p.loc)}${r(x("நிலை","Condition"),cond)}</div></div>
  <div class="card"><h3>${x("குடும்பம் / பாதுகாவலர்","Family / Guardian")}</h3><div class="row">${r(p.f1n||x("நபர் 1","Person 1"),p.f1p,1)}${r(p.f2n||x("நபர் 2","Person 2"),p.f2p,1)}${r((p.gn||x("பாதுகாவலர்","Guardian"))+" (Guardian)",p.gp,1)}</div></div>
  <div class="card"><h3>${x("அருகிலுள்ள மருத்துவமனை","Nearby hospitals")}</h3><div class="row">${[1,2].map(n=>r(p["h"+n+"n"]?p["h"+n+"n"]+" ("+ht(p["h"+n+"t"])+")":"",p["h"+n+"p"],1)).join("")}</div></div>
  <button class="p" id="ed">${x("தகவலை மாற்று","Edit info")}</button> <button class="g" id="so">${x("வெளியேறு","Sign out")}</button>
  <p class="muted">⚠️ ${x("இந்த app மருத்துவரின் ஆலோசனைக்கு மாற்று அல்ல. தகவல் உங்கள் போனில் மட்டுமே உள்ளது.","This app is not a substitute for a doctor. Your data stays on your phone only.")}</p>`;
  $("ed").onclick=()=>showReg(Object.assign({},U.p));$("so").onclick=()=>{try{localStorage.removeItem("ak_cur")}catch(e){}U=null;showReg()};
}

/* ---------- Start ---------- */
head();
const curE=gl("ak_cur");U=curE?gl("ak_u_"+curE):null;
U?enter():showReg();
</script>
